[mod]
id = "mekanism"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "eca14ef9c510c38951b5f92ae38747cd35cee525"

# All game logic: a plain crate staged into Horizon's workspace (horizon-mixins 0.6 bundle crates).
[[crate]]
id = "core"
path = "core"

# Glue that lives inside the game crate: translates game types to mekanism_core's.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mekanism"
source = "runtime.rs"

[[injection]]
id = "world-lifecycle"
hook = "world_lifecycle"
hook_version = 1
kind = "HEAD"
helper = "lifecycle.rs"
bindings = [{ name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" }]

[[injection]]
id = "block-entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block-entity-ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block-entity-container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block-entity-tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "right-click-block"
hook = "right_click_block"
hook_version = 1
kind = "HEAD"
helper = "right_click_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "face", ty = "[i32; 3]", value = "face" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "destroy-block"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "place-block"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "place_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::text::Text, u32)>", value = "&mut *lines" },
]

[[injection]]
id = "destroy-speed"
hook = "destroy_speed"
hook_version = 1
kind = "HEAD"
helper = "destroy_speed.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "Option<&horizon_client::items::ItemStack>", value = "stack" },
  { name = "hardness", ty = "f32", value = "hardness" },
  { name = "speed", ty = "&mut f32", value = "&mut *speed" },
]
